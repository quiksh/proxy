[workspace]
# The proxy (root package) plus the optional service-registration sidecar agent.
members = ["quik-register"]

[package]
name = "quik"
# Release version is managed by git tags / the Release workflow, not here.
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "A low-latency reverse proxy in Rust: HTTP/1.1, HTTP/2, TLS termination, dynamic upstream pools, Prometheus metrics, graceful drain."
readme = "README.md"
repository = "https://github.com/quiksh/proxy"
homepage = "https://quik.sh"
keywords = ["proxy", "reverse-proxy", "http", "tls", "load-balancer"]
categories = ["network-programming", "web-programming::http-server"]

[dependencies]
tokio = { version = "1.40", features = ["full"] }
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1.10", features = ["full"] }
http = "1"
http-body-util = "0.1"
bytes = "1"

rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "aws-lc-rs", "native-tokio"] }
webpki-roots = "0.26"

arc-swap = "1.7"

metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false, features = ["async-runtime", "tracing"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"

# JWT validation. getrandom underpins request-id and traceparent generation
# (already pulled in transitively via rustls; promoted to a direct dep here).
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
getrandom = "0.3"
serde_json = "1"

# Egress proxy: ipnet for CIDR matching, base64 for Basic auth decode.
ipnet = "2"
base64 = "0.22"

# Admin API: sha2 for cert fingerprint in audit log (mTLS principal).
sha2 = "0.10"

# Optional NATS service-registration watcher (behind the `nats` feature). The
# default build links none of this. `kv`/`jetstream` for the registry;
# `server_2_11` enables per-key TTL. Trim further once the feature set settles.
async-nats = { version = "0.49", optional = true, default-features = false, features = [
    "ring",
    "jetstream",
    "kv",
    "nkeys",        # credentials_file (JWT/.creds auth)
    "server_2_10",  # watch_many
    "server_2_11",  # per-key TTL
] }
# `StreamExt` for the KV watch/keys streams. Optional, only under `nats`.
futures = { version = "0.3", optional = true }

[features]
# First-class but optional NATS-backed service registration. Without it (the
# default), membership comes from config + the admin API only - zero NATS dep.
nats = ["dep:async-nats", "dep:futures"]

[dev-dependencies]
# test-util enables `#[tokio::test(start_paused = true)]` for deterministic
# virtual-time tests (e.g. the shutdown phase sequencer). Unioned with the
# normal tokio "full" dependency for test/bench builds only.
tokio = { version = "1.40", features = ["full", "test-util"] }
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2", "stream", "json"] }
criterion = { version = "0.5", features = ["html_reports"] }
hdrhistogram = "7"
http-body = "1"
# Raw HTTP/2 client for the rapid-reset (CVE-2023-44487) e2e - lets a test
# open streams and immediately RST them, which reqwest/hyper won't do.
h2 = "0.4"
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures = "0.3"
base64 = "0.22"

[[bench]]
name = "hot_path"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Project-specific allows kept narrow; tighten as the codebase stabilises.
too_many_arguments = "allow"
module_inception = "allow"
