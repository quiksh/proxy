{{- if .Values.serviceMonitor.enabled }}
{{- if not .Values.service.exposeAdmin }}
{{- fail "serviceMonitor.enabled requires service.exposeAdmin=true (metrics are served on the admin port)" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "quik.fullname" . }}
  labels:
    {{- include "quik.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "quik.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: admin
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
