name: Website

# Manually triggered from the Actions tab (run it on main). Builds the quik.sh
# static site (web/) into a container that serves it with static-web-server and
# publishes it to GHCR as ghcr.io/quiksh/website.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to ghcr.io

env:
  WEBSITE_IMAGE: ghcr.io/${{ github.repository_owner }}/website

jobs:
  build:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEBSITE_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      # Multi-arch is cheap here: the npm build runs once on the native arch
      # (build stage is pinned to $BUILDPLATFORM) and only the tiny SWS layer is
      # per-target.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website
