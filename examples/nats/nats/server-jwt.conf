# Production-shaped NATS auth: decentralised JWT (operator → account → user).
# Permissions live in each user's signed credential, so new scoped service
# identities are minted WITHOUT editing this file or restarting NATS.
#
# Generate the operator/account/users (and the resolver data) with:
#   ./nats/bootstrap-creds.sh
# then point the compose `nats` volume at this file instead of the no-auth one.

jetstream {
  store_dir: "/data"
}

http: 8222

# Root of trust - the operator JWT produced by nsc.
operator: /etc/nats/jwt/operator.jwt

# Account resolver. `nsc push`/a full resolver dir serves account JWTs; a
# memory resolver with preloaded accounts also works for a fixed demo.
resolver: {
  type: full
  dir: "/etc/nats/jwt/resolver"
  allow_delete: false
}

# In production, also terminate TLS here:
# tls {
#   cert_file: "/certs/nats-cert.pem"
#   key_file:  "/certs/nats-key.pem"
#   ca_file:   "/certs/ca.pem"
#   # verify_and_map: true   # enable for the mTLS-identity variant
# }
