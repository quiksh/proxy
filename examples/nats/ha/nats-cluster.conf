# Shared config for a 3-node NATS JetStream cluster. Mounted into nats-1/2/3;
# each node routes to all three (its own self-route is ignored). The KV bucket
# is created with --replicas 3 so registration survives a node loss.
jetstream {
  store_dir: "/data"
}
cluster {
  name: quik
  listen: 0.0.0.0:6222
  routes: [
    "nats://nats-1:6222",
    "nats://nats-2:6222",
    "nats://nats-3:6222"
  ]
}
http: 8222
